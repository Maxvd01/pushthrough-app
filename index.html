<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PushThrough</title>
<meta name="theme-color" content="#2f3d47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PushThrough">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f2; --surface:#fff; --ink:#1c2226; --muted:#5a646b; --line:#d5d9d6;
  --steel:#2f3d47; --signal:#111111; --ok:#1e7d3a; --red:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px}
.brand{font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:20px}
.brand span{color:var(--signal)}
.firma{font-size:13px;color:var(--muted)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mitte{text-align:center}
#aufnehmen{width:132px;height:132px;border-radius:50%;border:0;background:var(--signal);color:#fff;font-size:15px;font-weight:700;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.30);cursor:pointer}
#aufnehmen svg{width:40px;height:40px}
#aufnehmen.laeuft{background:var(--red);animation:puls 1.2s infinite}
@keyframes puls{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){#aufnehmen.laeuft{animation:none}}
#zeit{font-variant-numeric:tabular-nums;color:var(--muted);margin-top:8px;min-height:1.4em}
.hinweis{color:var(--muted);font-size:14px;margin:6px 0 0}
label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
textarea,input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.knopf{width:100%;padding:15px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer}
.knopf:disabled{opacity:.45;cursor:not-allowed}
.haupt{background:var(--steel);color:#fff}
.gruen{background:var(--ok);color:#fff}
.leise{background:transparent;border:1px solid var(--line);color:var(--ink)}
.reihe{display:flex;flex-direction:column;gap:10px}
#status{display:none;text-align:center;color:var(--muted)}
#status.an{display:block}
.lader{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--signal);border-radius:50%;margin:0 auto 8px;animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
#fehler{display:none;background:#fdecea;color:var(--red);border-radius:10px;padding:12px}
#fehler.an{display:block}
#entwurf{display:none}
#entwurf.an{display:block}
#entwurfInhalt{overflow-x:auto;font-size:15px}
#entwurfInhalt table{font-size:14px}
#fertig{display:none}
#fertig.an{display:block}
.gross{font-size:22px;font-weight:800;margin:0 0 4px}
.klein{font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">Push<span>Through</span></div>
  <div class="firma" id="firma"></div>
</header>
<main>
  <div id="fehler" role="alert"></div>

  <section class="karte mitte" id="aufnahmeKarte">
    <button id="aufnehmen" type="button" aria-label="Aufnahme starten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      <span id="aufnehmenText">Aufnehmen</span>
    </button>
    <div id="zeit"></div>
    <p class="hinweis" id="aufnahmeHinweis">Sag: Kunde, Adresse, was gemacht wurde, wer wie lange, welches Material.</p>
  </section>

  <section class="karte" id="status" aria-live="polite">
    <div class="lader"></div>
    <div id="statusText">Wird gelesen …</div>
  </section>

  <section class="karte" id="entwurf">
    <div id="entwurfInhalt"></div>
    <div class="reihe" style="margin-top:14px">
      <button class="knopf gruen" id="ok" type="button">OK – Rechnung erstellen</button>
      <button class="knopf leise" id="verwerfen" type="button">Verwerfen und neu beginnen</button>
    </div>
    <p class="hinweis">Etwas fehlt oder stimmt nicht? Einfach oben nochmal aufnehmen oder unten eine Notiz schreiben und „Ergänzung senden“ drücken.</p>
  </section>

  <section class="karte" id="fertig">
    <p class="gross" id="fertigTitel"></p>
    <p class="klein" id="fertigText"></p>
    <div class="reihe" style="margin-top:12px">
      <button class="knopf haupt" id="teilen" type="button">Rechnung senden / teilen</button>
      <a class="knopf leise" id="whatsapp" href="#" hidden style="text-align:center;text-decoration:none">WhatsApp-Chat mit dem Kunden öffnen</a>
      <button class="knopf leise" id="neu" type="button">Neue Rechnung</button>
    </div>
  </section>

  <section class="karte reihe" id="felder">
    <div>
      <label for="notiz">Notizen</label>
      <textarea id="notiz" placeholder="z. B. Rechnungsadresse, UID, „Vorhängeschloss 25 Euro“"></textarea>
    </div>
    <div>
      <label for="empfaenger">Rechnung senden an (E-Mail oder Nummer)</label>
      <input id="empfaenger" type="text" inputmode="email" autocomplete="off" placeholder="z. B. kunde@mail.at oder 0664 1234567">
    </div>
    <button class="knopf haupt" id="senden" type="button">Notiz senden</button>
  </section>
</main>

<script>
(function () {
  var BASIS = 'https://maxdurig.app.n8n.cloud/webhook/';
  var params = new URLSearchParams(location.search);
  var k = params.get('k') || '';
  try { if (k) localStorage.setItem('pt_k', k); else k = localStorage.getItem('pt_k') || ''; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var entwurfId = '';
  var recorder = null, chunks = [], stream = null, start = 0, uhr = null, mime = '';
  var pdfDatei = null, pdfName = '', telefon = '';

  function fehler(t) { var f = $('fehler'); f.textContent = t || ''; f.classList.toggle('an', !!t); }
  function status(t) { $('statusText').textContent = t || ''; $('status').classList.toggle('an', !!t); }
  function sendenText() { $('senden').textContent = entwurfId ? 'Ergänzung senden' : 'Notiz senden'; $('aufnehmenText').textContent = recorder && recorder.state === 'recording' ? 'Stopp' : (entwurfId ? 'Ergänzen' : 'Aufnehmen'); }

  if (!k) fehler('Dieser Link ist unvollständig. Bitte den persönlichen Link vom Betrieb verwenden.');

  function waehleMime() {
    var kandidaten = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/ogg;codecs=opus'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    for (var i = 0; i < kandidaten.length; i++) if (MediaRecorder.isTypeSupported(kandidaten[i])) return kandidaten[i];
    return '';
  }

  $('aufnehmen').addEventListener('click', function () {
    fehler('');
    if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { fehler('Dieses Handy unterstützt keine Aufnahme im Browser. Bitte Safari (iPhone) oder Chrome (Android) verwenden.'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s; chunks = []; mime = waehleMime();
      recorder = mime ? new MediaRecorder(s, { mimeType: mime }) : new MediaRecorder(s);
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.onstop = function () {
        clearInterval(uhr); $('zeit').textContent = '';
        $('aufnehmen').classList.remove('laeuft'); sendenText();
        stream.getTracks().forEach(function (t) { t.stop(); });
        var typ = recorder.mimeType || mime || 'audio/webm';
        var blob = new Blob(chunks, { type: typ });
        if (blob.size < 1000) { fehler('Die Aufnahme war zu kurz. Bitte nochmal.'); return; }
        schicken(blob, typ);
      };
      recorder.start();
      start = Date.now();
      $('aufnehmen').classList.add('laeuft'); sendenText();
      uhr = setInterval(function () { var s = Math.floor((Date.now() - start) / 1000); $('zeit').textContent = 'Aufnahme läuft · ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' · zum Beenden tippen'; }, 250);
    }).catch(function () { fehler('Kein Zugriff aufs Mikrofon. Bitte in den Einstellungen erlauben und neu laden.'); });
  });

  $('senden').addEventListener('click', function () {
    fehler('');
    if (!$('notiz').value.trim()) { fehler('Bitte zuerst eine Notiz schreiben oder aufnehmen.'); return; }
    schicken(null, '');
  });

  function schicken(blob, typ) {
    var fd = new FormData();
    fd.append('k', k);
    fd.append('entwurf_id', entwurfId);
    fd.append('notiz', $('notiz').value.trim());
    if (blob) {
      var ext = typ.indexOf('mp4') >= 0 ? 'mp4' : typ.indexOf('ogg') >= 0 ? 'ogg' : 'webm';
      fd.append('audio', blob, 'aufnahme.' + ext);
    }
    sperren(true);
    status(entwurfId ? 'Ergänzung wird eingearbeitet …' : 'Wird gelesen und berechnet … (ca. 20–40 Sekunden)');
    fetch(BASIS + 'pushthrough-app-entwurf', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        status('');
        sperren(false);
        if (!d || !d.ok) { fehler((d && d.fehler) || 'Das hat nicht geklappt. Bitte nochmal versuchen.'); return; }
        entwurfId = d.entwurf_id;
        $('notiz').value = '';
        $('entwurfInhalt').innerHTML = d.html || '';
        $('entwurf').classList.add('an');
        $('ok').disabled = !d.freigabe_moeglich;
        $('ok').textContent = d.freigabe_moeglich ? 'OK – Rechnung erstellen' : 'Noch nicht vollständig – siehe rot';
        sendenText();
        $('entwurf').scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function () { status(''); sperren(false); fehler('Keine Verbindung. Bitte Internet prüfen und nochmal versuchen.'); });
  }

  function sperren(an) { ['aufnehmen', 'senden', 'ok', 'verwerfen'].forEach(function (id) { $(id).disabled = an; }); }

  $('ok').addEventListener('click', function () {
    fehler('');
    var fd = new FormData();
    fd.append('k', k);
    fd.append('entwurf_id', entwurfId);
    fd.append('empfaenger', $('empfaenger').value.trim());
    sperren(true);
    status('Rechnung wird erstellt …');
    fetch(BASIS + 'pushthrough-app-ok', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        status(''); sperren(false);
        if (!d || !d.ok) { fehler((d && d.fehler) || 'Das hat nicht geklappt. Bitte nochmal versuchen.'); return; }
        var bytes = Uint8Array.from(atob(d.pdf_base64), function (c) { return c.charCodeAt(0); });
        pdfName = d.dateiname || (d.rechnungsnummer + '.pdf');
        pdfDatei = new File([bytes], pdfName, { type: 'application/pdf' });
        telefon = d.telefon || '';
        $('entwurf').classList.remove('an');
        $('aufnahmeKarte').hidden = true; $('felder').hidden = true;
        $('fertig').classList.add('an');
        $('fertigTitel').textContent = 'Rechnung ' + d.rechnungsnummer + ' ist fertig';
        var t = (d.kunde || '') + ' · ' + Number(d.brutto || 0).toFixed(2).replace('.', ',') + ' €. ';
        if (d.email) t += d.email_gesendet ? 'Per E-Mail an ' + d.email + ' geschickt.' : 'E-Mail an ' + d.email + ' nicht geschickt: ' + d.email_fehler + ' Bitte über „Senden / teilen“ schicken.';
        else if (telefon) t += 'Tippe auf „Senden / teilen“, wähle WhatsApp und dann den Kunden.';
        $('fertigText').textContent = t;
        if (telefon) {
          var nr = telefon.replace('+', '');
          $('whatsapp').href = 'https://wa.me/' + nr + '?text=' + encodeURIComponent('Grüß Gott, die Rechnung ' + d.rechnungsnummer + ' schicke ich Ihnen gleich als PDF. Vielen Dank für Ihren Auftrag!');
          $('whatsapp').hidden = false;
        }
      })
      .catch(function () { status(''); sperren(false); fehler('Keine Verbindung. Bitte Internet prüfen und nochmal versuchen.'); });
  });

  $('teilen').addEventListener('click', function () {
    if (!pdfDatei) return;
    if (navigator.canShare && navigator.canShare({ files: [pdfDatei] })) {
      navigator.share({ files: [pdfDatei], title: pdfName }).catch(function () {});
    } else {
      var url = URL.createObjectURL(pdfDatei);
      var a = document.createElement('a'); a.href = url; a.download = pdfName; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }
  });

  function zuruecksetzen() {
    entwurfId = ''; pdfDatei = null; telefon = '';
    $('notiz').value = ''; $('empfaenger').value = '';
    $('entwurfInhalt').innerHTML = '';
    $('entwurf').classList.remove('an'); $('fertig').classList.remove('an');
    $('whatsapp').hidden = true;
    $('aufnahmeKarte').hidden = false; $('felder').hidden = false;
    fehler(''); sendenText();
    window.scrollTo(0, 0);
  }
  $('verwerfen').addEventListener('click', zuruecksetzen);
  $('neu').addEventListener('click', zuruecksetzen);
  sendenText();
})();
</script>
</body>
</html>
